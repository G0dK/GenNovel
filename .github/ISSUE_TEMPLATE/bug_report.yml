name: Bug 报告
description: 提交可复现的 GenNovel 功能缺陷
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 感谢反馈。请先确认问题可在最新 main 或最新版本复现。
  - type: input
    id: version
    attributes:
      label: GenNovel 版本
      placeholder: "例如：0.2.0 或 commit SHA"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      placeholder: "操作系统、Python 版本、安装或部署方式"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供最小、完整、可重复执行的步骤，并移除密钥和书籍隐私数据。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与日志
      render: shell
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，未发现相同报告。
          required: true
        - label: 我已移除 API Key、Token、私人正文和其他敏感数据。
          required: true
